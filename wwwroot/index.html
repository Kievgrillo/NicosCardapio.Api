<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Nico's Distribuidora – Cardápio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
            *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --orange: #e8661a;
                --orange-d: #c4541200;
                --bg: #0d0d0d;
                --bg2: #161616;
                --bg3: #1e1e1e;
                --border: #2a2a2a;
                --text: #f0ece4;
                --muted: #777;
                --radius: 10px;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: 'Nunito', sans-serif;
                min-height: 100vh;
                -webkit-tap-highlight-color: transparent;
            }

            header {
                position: sticky;
                top: 0;
                z-index: 200;
                background: var(--bg);
                border-bottom: 2px solid var(--orange);
                padding: 14px 16px 10px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }

            .header-brand h1 {
                font-family: 'Bebas Neue', sans-serif;
                font-size: 1.7rem;
                color: var(--orange);
                letter-spacing: 2px;
                line-height: 1;
            }

            .header-brand p {
                font-size: 10px;
                color: var(--muted);
                letter-spacing: 2px;
                text-transform: uppercase;
                margin-top: 1px;
            }

            .header-tel {
                font-size: 11px;
                color: var(--muted);
                text-align: right;
                line-height: 1.6;
            }

                .header-tel strong {
                    color: var(--orange);
                    font-size: 13px;
                    display: block;
                }

            .search-wrap {
                padding: 10px 16px;
                background: var(--bg2);
                border-bottom: 1px solid var(--border);
            }

                .search-wrap input {
                    width: 100%;
                    background: var(--bg3);
                    border: 1px solid var(--border);
                    border-radius: 8px;
                    padding: 9px 14px;
                    font-family: 'Nunito', sans-serif;
                    font-size: 14px;
                    color: var(--text);
                    outline: none;
                }

                    .search-wrap input::placeholder {
                        color: var(--muted);
                    }

                    .search-wrap input:focus {
                        border-color: var(--orange);
                    }

            .tabs-outer {
                position: sticky;
                top: 69px;
                z-index: 100;
                background: var(--bg2);
                border-bottom: 1px solid var(--border);
            }

            .tabs-scroll {
                display: flex;
                overflow-x: auto;
                scrollbar-width: none;
                padding: 0 8px;
            }

                .tabs-scroll::-webkit-scrollbar {
                    display: none;
                }

            .tab-btn {
                flex-shrink: 0;
                padding: 11px 14px;
                font-family: 'Nunito', sans-serif;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: .5px;
                text-transform: uppercase;
                color: var(--muted);
                background: none;
                border: none;
                border-bottom: 3px solid transparent;
                cursor: pointer;
                transition: color .2s, border-color .2s;
                white-space: nowrap;
            }

                .tab-btn.active {
                    color: var(--orange);
                    border-bottom-color: var(--orange);
                }

                .tab-btn:hover:not(.active) {
                    color: var(--text);
                }

            main {
                padding: 16px;
                max-width: 620px;
                margin: 0 auto;
            }

            .section {
                display: none;
                animation: fadeIn .25s ease;
            }

                .section.active {
                    display: block;
                }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }

                to {
                    opacity: 1;
                    transform: none;
                }
            }

            #search-section {
                display: none;
            }

                #search-section.active {
                    display: block;
                }

            .section-header {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 16px;
                padding-bottom: 10px;
                border-bottom: 1px solid var(--border);
            }

            .section-icon {
                font-size: 1.4rem;
            }

            .section-name {
                font-family: 'Bebas Neue', sans-serif;
                font-size: 1.5rem;
                letter-spacing: 2px;
                color: var(--orange);
            }

            .subcat-label {
                font-size: 10px;
                font-weight: 800;
                letter-spacing: 2px;
                text-transform: uppercase;
                color: var(--muted);
                margin: 20px 0 8px;
                padding-left: 4px;
            }

            .item {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 10px;
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 12px 14px;
                margin-bottom: 7px;
                transition: border-color .2s;
            }

                .item:hover {
                    border-color: #3a3a3a;
                }

                .item.destaque {
                    border-color: var(--orange);
                }

            .item-name {
                font-size: 14px;
                font-weight: 700;
                color: var(--text);
                line-height: 1.3;
            }

            .item-desc {
                font-size: 12px;
                color: var(--muted);
                margin-top: 3px;
                line-height: 1.5;
            }

            .item-price {
                font-size: 15px;
                font-weight: 800;
                color: var(--orange);
                white-space: nowrap;
                padding-top: 1px;
            }

            .loading {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 60px 20px;
                gap: 16px;
                color: var(--muted);
                font-size: 14px;
            }

            .spinner {
                width: 36px;
                height: 36px;
                border: 3px solid var(--border);
                border-top-color: var(--orange);
                border-radius: 50%;
                animation: spin .7s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .erro {
                text-align: center;
                padding: 40px 20px;
                color: var(--muted);
                font-size: 14px;
                line-height: 1.8;
            }

                .erro strong {
                    color: var(--orange);
                    display: block;
                    font-size: 16px;
                    margin-bottom: 6px;
                }

            footer {
                text-align: center;
                padding: 28px 16px 40px;
                font-size: 11px;
                color: #444;
                letter-spacing: 1px;
                line-height: 2;
            }

                footer a {
                    color: var(--orange);
                    text-decoration: none;
                }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <h1>Nico's Distribuidora</h1>
            <p>Cardápio Digital</p>
        </div>
        <div class="header-tel">
            <strong>(27) 98142-0764</strong>
            Nico's Delivery ON
        </div>
    </header>

    <div class="search-wrap">
        <input type="search" id="busca" placeholder="🔍  Buscar item..." autocomplete="off" />
    </div>

    <div class="tabs-outer">
        <div class="tabs-scroll" id="tabs-container">
        </div>
    </div>

    <main id="main-content">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <span>Carregando cardápio...</span>
        </div>
    </main>

    <footer>
        Nico's Distribuidora &mdash; <a href="tel:+5527981420764">(27) 98142-0764</a><br>
        Preços sujeitos a alteração sem aviso prévio.
    </footer>

    <script>

/* =============================================
   CONFIG — ajuste a URL se a API mudar de porta
============================================= */
const API_URL = '/api/cardapio';

let categorias = [];
let categoriaAtiva = 0;

const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

document.getElementById('busca').addEventListener('input', function () {
  const q = this.value.trim().toLowerCase();
  if (!q) {
    renderCategoria(categoriaAtiva);
    return;
  }

  const resultados = [];
  for (const cat of categorias) {
    for (const item of cat.itens) {
      if (item.nome.toLowerCase().includes(q) || (item.descricao || '').toLowerCase().includes(q)) {
        resultados.push({ ...item, _catNome: cat.nome, _catIcone: cat.icone });
      }
    }
  }

  const main = document.getElementById('main-content');
  if (!resultados.length) {
    main.innerHTML = `<div class="erro"><strong>Nenhum resultado</strong>Tente outro termo de busca.</div>`;
    return;
  }

  let html = `<div class="section active">
    <div class="section-header">
      <span class="section-icon">🔍</span>
      <span class="section-name">${resultados.length} resultado${resultados.length > 1 ? 's' : ''}</span>
    </div>`;
  for (const item of resultados) {
    html += itemHtml(item) ;
  }
  html += '</div>';
  main.innerHTML = html;
});

function itemHtml(item) {
  return `
    <div class="item${item.destaque ? ' destaque' : ''}">
      <div>
        <p class="item-name">${item.nome}</p>
        ${item.descricao ? `<p class="item-desc">${item.descricao}</p>` : ''}
      </div>
      <p class="item-price">${brl(item.preco)}</p>
    </div>`;
}

function renderCategoria(idx) {
  categoriaAtiva = idx;
  document.getElementById('busca').value = '';

  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));

  const cat = categorias[idx];
  if (!cat) return;

  const grupos = {};
  for (const item of cat.itens) {
    const key = item.subCategoria || '__sem__';
    if (!grupos[key]) grupos[key] = [];
    grupos[key].push(item);
  }

  let html = `<div class="section active">
    <div class="section-header">
      <span class="section-icon">${cat.icone}</span>
      <span class="section-name">${cat.nome}</span>
    </div>`;

  for (const [key, itens] of Object.entries(grupos)) {
    if (key !== '__sem__') {
      html += `<p class="subcat-label">${key}</p>`;
    }
    for (const item of itens) {
      html += itemHtml(item);
    }
  }

  html += '</div>';
  document.getElementById('main-content').innerHTML = html;

  window.scrollTo({ top: 0, behavior: 'smooth' });

  const btn = document.querySelectorAll('.tab-btn')[idx];
  if (btn) btn.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
}

async function carregarCardapio() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    categorias = await res.json();
    const tabsEl = document.getElementById('tabs-container');
    tabsEl.innerHTML = categorias
      .map((c, i) => `<button class="tab-btn${i === 0 ? ' active' : ''}" onclick="renderCategoria(${i})">${c.icone} ${c.nome}</button>`)
      .join('');

    renderCategoria(0);
  } catch (err) {
    document.getElementById('main-content').innerHTML = `
      <div class="erro">
        <strong>Não foi possível carregar o cardápio</strong>
        Verifique se a API está rodando e tente recarregar.<br><br>
        <small style="color:#555">${err.message}</small>
      </div>`;
  }
}

carregarCardapio();
    </script>
</body>
</html>
